<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Flow — Modern Ticket Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">🎟️</div>
      <span class="brand-name">Ticket Flow</span>
      <span class="brand-badge">Go + Postgres</span>
    </div>
    <div class="nav-actions">
      <button class="btn btn-secondary btn-icon" id="btnRefresh" title="Refresh Tickets">
        🔄
      </button>
      <button class="btn btn-primary" id="btnNewTicket">
        <span>+</span> New Ticket
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-container">
    
    <!-- Metrics KPI Ribbon -->
    <section class="metrics-grid">
      <div class="metric-card total">
        <div class="metric-icon-wrap">📊</div>
        <div class="metric-info">
          <h4>Total Tickets</h4>
          <div class="metric-count" id="metricTotal">0</div>
        </div>
      </div>
      <div class="metric-card open">
        <div class="metric-icon-wrap">📬</div>
        <div class="metric-info">
          <h4>Open</h4>
          <div class="metric-count" id="metricOpen">0</div>
        </div>
      </div>
      <div class="metric-card inprogress">
        <div class="metric-icon-wrap">⚡</div>
        <div class="metric-info">
          <h4>In Progress</h4>
          <div class="metric-count" id="metricInProgress">0</div>
        </div>
      </div>
      <div class="metric-card resolved">
        <div class="metric-icon-wrap">✨</div>
        <div class="metric-info">
          <h4>Resolved</h4>
          <div class="metric-count" id="metricResolved">0</div>
        </div>
      </div>
      <div class="metric-card closed">
        <div class="metric-icon-wrap">🔒</div>
        <div class="metric-info">
          <h4>Closed</h4>
          <div class="metric-count" id="metricClosed">0</div>
        </div>
      </div>
    </section>

    <!-- Toolbar: Search, Filters & View Toggle -->
    <section class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search by title, assignee, or ID...">
        </div>

        <select id="statusFilter" class="select-filter">
          <option value="">All Statuses</option>
          <option value="OPEN">Open</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="RESOLVED">Resolved</option>
          <option value="CLOSED">Closed</option>
        </select>

        <select id="priorityFilter" class="select-filter">
          <option value="">All Priorities</option>
          <option value="LOW">Low Priority</option>
          <option value="MEDIUM">Medium Priority</option>
          <option value="HIGH">High Priority</option>
          <option value="CRITICAL">Critical Priority</option>
        </select>
      </div>

      <div class="toolbar-right">
        <div class="view-toggle">
          <button class="toggle-btn active" id="btnViewKanban">
            <span>📋</span> Kanban
          </button>
          <button class="toggle-btn" id="btnViewList">
            <span>☰</span> List
          </button>
        </div>
      </div>
    </section>

    <!-- Kanban Board View -->
    <section id="kanbanView" class="kanban-grid">
      
      <!-- Column: OPEN -->
      <div class="kanban-column" data-status="OPEN">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="status-indicator OPEN"></span>
            <span class="column-title">Open</span>
          </div>
          <span class="column-badge" id="badgeOpen">0</span>
        </div>
        <div class="column-body" id="laneOpen"></div>
      </div>

      <!-- Column: IN_PROGRESS -->
      <div class="kanban-column" data-status="IN_PROGRESS">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="status-indicator IN_PROGRESS"></span>
            <span class="column-title">In Progress</span>
          </div>
          <span class="column-badge" id="badgeInProgress">0</span>
        </div>
        <div class="column-body" id="laneInProgress"></div>
      </div>

      <!-- Column: RESOLVED -->
      <div class="kanban-column" data-status="RESOLVED">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="status-indicator RESOLVED"></span>
            <span class="column-title">Resolved</span>
          </div>
          <span class="column-badge" id="badgeResolved">0</span>
        </div>
        <div class="column-body" id="laneResolved"></div>
      </div>

      <!-- Column: CLOSED -->
      <div class="kanban-column" data-status="CLOSED">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="status-indicator CLOSED"></span>
            <span class="column-title">Closed</span>
          </div>
          <span class="column-badge" id="badgeClosed">0</span>
        </div>
        <div class="column-body" id="laneClosed"></div>
      </div>

    </section>

    <!-- List View (Hidden by default) -->
    <section id="listView" class="table-container" style="display: none;">
      <table class="ticket-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Assignee</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </section>

  </main>

  <!-- Create / Edit Ticket Modal -->
  <div class="modal-overlay" id="ticketModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Create New Ticket</h3>
        <button class="close-btn" id="btnCloseModal">✕</button>
      </div>
      <form id="ticketForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="ticketTitle">Ticket Title *</label>
            <input type="text" id="ticketTitle" class="form-input" placeholder="e.g. Fix webhook timeout during charge.failed" required minlength="3" maxlength="100">
          </div>

          <div class="form-group">
            <label class="form-label" for="ticketDesc">Description</label>
            <textarea id="ticketDesc" class="form-textarea" placeholder="Provide background context or steps to reproduce..."></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="ticketPriority">Priority *</label>
              <select id="ticketPriority" class="form-select" required>
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="ticketAssignee">Assignee</label>
              <input type="text" id="ticketAssignee" class="form-input" placeholder="e.g. Subit">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSubmitModal">Save Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Floating Toast Notifications Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
